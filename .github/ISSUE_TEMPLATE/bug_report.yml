name: Bug Report
description: Report a bug or unexpected behavior in AgentDeck
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open AgentDeck in Antigravity...
        2. Go to ...
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node.js & Provider Setup
      placeholder: "e.g. Node v24.15.0, Codex CLI 0.172.0, Magpie / OpenRouter"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Message or Screenshots (please redact any API keys)
      description: Paste relevant console output or attach screenshots.
